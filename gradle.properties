# JVM arguments for the Gradle daemon and the Kotlin daemon.
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -Xmx4g -Xms1g -XX:MaxMetaspaceSize=2g
kotlin.daemon.jvmargs=-Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -Xmx2g
# The build compiles with a JDK 17 toolchain (see settings.gradle.kts and
# app/build.gradle.kts); let Gradle download one when it is missing locally.
org.gradle.java.installations.auto-download=true

org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.builtInKotlin=false
android.newDsl=false

kotlin.code.style=official
